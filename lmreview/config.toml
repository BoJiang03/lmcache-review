# lmreview settings. To change them without editing this file, point LMREVIEW_CONFIG at a TOML
# file that sets only the keys you want; it is merged on top of this one. Command-line flags win
# over both. Unknown keys are an error (a typo would otherwise be ignored silently).

[review]
# The four settings below are part of the reviewer's name (<prompt>+<book>@<effort>[x<n>][-rc][-sh]),
# so runs made with other settings are never mixed with these in the cache.
effort = "high"      # low | medium | high | xhigh | max
rulecheck = true     # -rc: one more agent that gives a verdict on every applicable rule
parallel = 1         # x<n>: main review agents run at once, then one merge agent
shell = false        # -sh: the agents also get a sandboxed shell (needs bubblewrap and socat)
# The rule check (rulecheck.md) runs without tools on the diff and the discussion. When the rules that
# apply to a PR total more words than this, a first call picks the ones worth checking from their
# "when" lines (rulepick.md), and only those are checked in full.
rulecheck_stage_words = 6000
rulecheck_effort = "medium"  # the tool-less rule check (2026-11-24 pilot: same verdicts as high on 14 samples, all
                             # new rules still fire on their source PRs, ~18% cheaper)

[judge]
effort = "high"      # cached scores record their effort; a different one refuses to reuse them
second_opinion = true  # a missed point, or a rule's finding judged invalid, counts only if a second call agrees

[annotate]
effort = "high"      # splitting human comments into points and typing them (once per sample, by vote)

[distill]
effort = "high"
consolidate_drafts = 3 # tidy the whole book: drafts run in parallel; a change needs most of them to agree
induce = false         # step 5: principles over standalone entries (their parents earned nothing)
min_signal_prs = 2     # revise / retire on failure signals alone: they must come from this many PRs
max_tries = 2          # distill attempts per comment before it goes to a person (needs_human)
max_requeues = 2       # times a parked (needs_human) comment gets another chance when the workflow changed (state.requeue_parked)

[vet]
side_per_entry = 2     # side effects: source comments replayed per affected entry
reps = 1               # runs per replayed case and book
precision = false      # precision gate off (2026-11-25): rules grown too wide are left to human feedback after
                       # launch; vet gates recall only. true: revert changed entries drawing more refuted findings
wide_margin = 1        # precision gate: a changed entry is reverted when, on the samples where it drew refuted
                       # findings, it drew more than this many more than the text it replaces did

[hybrid]
# Learning (round, and judge / distill reading its runs) reviews with the reviewer in use plus -ms: the main
# review runs on this model and effort, the rule check stays as [review] says, and no merge call runs.
learn = true         # false: learning uses the reviewer in use as is
main_model = "claude-sonnet-5-5"
main_effort = "medium"

[select]
on = false           # off since 2026-11-24: on the deployment scope (mostly 1-2 points per commit) scores tie and
                     # the kept half held only 62-77% of the misses; round reviews every sample it is given
# round only: which new training samples to review (lmreview/selection.py). Each sample scores the sum,
# over its change-request and nit points, of how often the reviewer misses a point of that kind; the
# top `keep` share of the new samples is reviewed.
keep = 0.5           # share of the new samples kept (on 252 samples the top half held ~88% of the misses)
min_points = 30      # a kind's miss rate comes from the reviewer's own judged runs once it has this many points

[select.weights]     # default miss rates per <type>/<severity> (Opus@high, v0b+team-v1, 252 samples); others 0.5
"nit/nit" = 0.88
"nit/minor" = 0.5
"change_request/nit" = 0.86
"change_request/minor" = 0.56
"change_request/major" = 0.26
"change_request/blocker" = 0.0

# Default cost caps in dollars (each command's --max-cost / round's --*-cost).
[budget]
review = 15.0
eval = 10.0
judge = 10.0
distill = 5.0
vet = 30.0
regress = 10.0
compress = 3.0          # `lmreview compress`: drafts and final texts (vet is separate)

[budget.round]
select = 5.0         # annotating the new samples (judge reuses the annotations)
review = 30.0
judge = 10.0
confirm = 10.0       # a second review (and judge) of the samples with new misses, before distill (state.confirm_misses)
distill = 5.0
vet = 30.0

# Paths. "" = automatic: a checkout uses its data/ dir, an installed copy ~/.cache/lmreview/.
# The env vars LMREVIEW_REPO / _DATA / _VLLM / _SANDBOX / _STATE win over these.
[paths]
repo = ""
data = ""
vllm = ""
state = ""                                 # "" = lmreview/state/ in the package
sandbox = "/var/tmp/lmreview-{uid}/sandbox"  # agent workspaces; outside $HOME and /tmp (see llm.py)

[compress]
stages = ["trim", "merge"]  # passes of a round's compress, in order (each: full pass + vet, then repairs); "trim2" also exists
tries = 2            # compress + vet runs per stage: later ones repair only what vet undid, with the rule check's reasons
drafts = 5           # merge: independent drafts proposing groups
trim_words = 100     # trim: entries whose when + expect is longer are rewritten
trim_budget = [50, 10]   # trim: words for when + expect: first proven sample, each further one (2026-11-25: one pass at the tight budget; was 70,15 then a trim2 pass)
trim2_budget = [50, 10]  # trim2: the tighter second pass (every entry over its budget)
words = 10000        # round compresses the book (then vets it) when its active entries total more words than this;
                     # a trigger, not a limit: the book may stay above it when nothing can be merged
