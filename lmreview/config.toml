# lmreview settings. To change them without editing this file, point LMREVIEW_CONFIG at a TOML
# file that sets only the keys you want; it is merged on top of this one. Command-line flags win
# over both. Unknown keys are an error (a typo would otherwise be ignored silently).

[review]
# The effort is part of the reviewer's name (<prompt>+<book>@<effort>-rc), and the rule check's settings
# below are part of the prompt id, so runs made with other settings are never mixed with these in the cache.
# -rc: one more agent next to the main review gives a verdict on every applicable rule; the findings of both
# are listed side by side.
effort = "medium"    # low | medium | high | xhigh | max. medium since 2026-11-26: same recall as high on 6 samples (26/37), -24% cost, -28% time; learning runs at this effort too
# The rule check (rulecheck.md) runs without tools on the diff and the discussion. When the rules that
# apply to a PR total more words than this, a first call picks the ones worth checking from their
# "when" lines (rulepick.md), and only those are checked in full.
rulecheck_stage_words = 6000
dedupe_model = "claude-sonnet-5-5"  # -rc side by side: checks which rule-check findings repeat the main review
rulecheck_effort = "medium"  # back from low (2026-11-26): low was never checked on learning. The tool-less rule check (2026-11-24 pilot: same verdicts as high on 14 samples, all
                             # new rules still fire on their source PRs, ~18% cheaper)

[judge]
effort = "high"      # cached scores record their effort; a different one refuses to reuse them
second_opinion = true  # a missed point, or a rule's finding judged invalid, counts only if a second call agrees

[annotate]
effort = "high"      # splitting human comments into points and typing them (once per sample, by vote)

[distill]
effort = "high"
consolidate_drafts = 3 # tidy the whole book: drafts run in parallel; a change needs most of them to agree
min_signal_prs = 2     # revise / retire on failure signals alone: they must come from this many PRs
specificity = true     # written / changed entries pass specificity.py (identifier lint + a model check); one rewrite, else dropped / reverted
max_requeues = 2       # times a parked (needs_human) comment gets another chance when the workflow changed (state.requeue_parked)

[tiers]  # a point's severity tier (annotate.tier; none counts as minor) sets how hard it is learned
max_tries = { "major+" = 3, minor = 2, nit = 1 }        # distill attempts before a person looks (needs_human)
retain_need = { "major+" = 0, minor = 0, nit = 1 }      # retain runs that must catch it; 0 = every run
retain_requeues = { "major+" = 2, minor = 1, nit = 0 }  # times retain sends a missed point back to distill; then
                                                        # major+ goes to a person, minor / nit stay learned, marked "unretained"

[vet]
side_per_entry = 2     # side effects: source comments replayed per affected entry
reps = 1               # runs per replayed case and book
# Rule-only runs are judged against every point of the sample, as production runs are judged (2026-11-26: a
# judge shown only the asked-about point passed findings that production matched to no point). vet gates
# recall only: rules grown too wide are left to human feedback after launch (2026-11-25).

# Learning reviews with the production reviewer (2026-11-26: current prompt and book at [review] effort), and
# a point counts as found only when every confirm run finds it; one found in some runs goes to distill as flaky.

[retain]
# "Learned" means the production reviewer catches it every time (2026-11-26): `lmreview retain` (and round,
# after each judge and vet) re-runs the rule check of the current prompt and book (-ro, see state.retain_reviewer)
# on the samples of covered / resolved points `reps` times, judges against every point, and sends a point
# caught in fewer than all runs back to to_distill.
on = true
reps = 2

# Default cost caps in dollars (each command's --max-cost / round's --*-cost).
[budget]
judge = 10.0
distill = 5.0
vet = 30.0
retain = 30.0           # `lmreview retain`: production re-reviews (2 per sample) and their judge
compress = 3.0          # `lmreview compress`: drafts and final texts (vet is separate)

[budget.round]
review = 30.0
judge = 10.0
confirm = 10.0       # a second review (and judge) of the samples with new misses, before distill (state.confirm_misses)
distill = 5.0
retain = 20.0        # production re-reviews of what a round learned (state.retain_step)
vet = 30.0

# Paths. "" = automatic: a checkout uses its data/ dir, an installed copy ~/.cache/lmreview/.
# The env vars LMREVIEW_REPO / _DATA / _VLLM / _SANDBOX / _STATE win over these.
[paths]
repo = ""
data = ""
vllm = ""
state = ""                                 # "" = lmreview/state/ in the package
sandbox = "/var/tmp/lmreview-{uid}/sandbox"  # agent workspaces; outside $HOME and /tmp (see llm.py)

[compress]
stages = ["trim", "merge"]  # passes of a round's compress, in order (each: full pass + vet, then repairs)
tries = 2            # compress + vet runs per stage: later ones repair only what vet undid, with the rule check's reasons
drafts = 5           # merge: independent drafts proposing groups
trim_words = 100     # trim: entries whose when + expect is longer are rewritten
trim_budget = [50, 10]   # trim: words for when + expect: first proven sample, each further one (2026-11-25: one pass at the tight budget; was 70,15)
words = 10000        # round compresses the book (then vets it) when its active entries total more words than this;
                     # a trigger, not a limit: the book may stay above it when nothing can be merged
